name: Build user IDE

on:
  push:
    paths:
      - infra/user-ide/**

jobs:

  build-ide:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
      -
        name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      -
        name: Get smart tag
        id: prepare
        uses: Surgo/docker-smart-tag-action@v1
        with:
          default_branch: main
          docker_image: harbor.puzzle.ch/puzzle/amm-techlab-ide
      -
        name: Define image tag
        run: |
          if [[ "${{ steps.prepare.outputs.tag }}" == *:edge ]]; then
              echo "IDE_IMAGE_TAG=harbor.puzzle.ch/puzzle/amm-techlab-ide:latest" >> $GITHUB_ENV
          else
              echo "IDE_IMAGE_TAG=${{ steps.prepare.outputs.tag }}" >> $GITHUB_ENV
          fi
      -
        name: Using image tag
        run: echo ${{ env.IDE_IMAGE_TAG }}
      -
        name: Login to harbor.puzzle.ch Container Registry
        uses: docker/login-action@v3 
        with:
          registry: harbor.puzzle.ch
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_AUTH }}
      -
        name: Build Latest Version
        uses: docker/build-push-action@v6
        with:
          context: ./infra/user-ide
          file: ./infra/user-ide/Dockerfile
          push: true
          tags: ${{ env.IDE_IMAGE_TAG }}
      -
        name: Run vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: '${{ env.IDE_IMAGE_TAG }}'
          format: 'table'
          output: 'trivy-results.txt'
          exit-code: '0'
          ignore-unfixed: true
          severity: 'CRITICAL,HIGH'
      -
        name: Archive vulnerability scan results
        uses: actions/upload-artifact@v4
        with:
          name: trivy-results-ide
          path: trivy-results.txt
